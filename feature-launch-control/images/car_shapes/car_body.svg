<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top-down car, front at the top. Front wheels steered by S1, ESC on M1. -->
  <path class="line" d="M70 13 L80 5 L90 13"/>
  <rect class="line" x="54" y="22" width="52" height="162" rx="18"/>
  <path class="line soft" d="M60 76 Q80 67 100 76"/>
  <path class="line soft" d="M62 150 Q80 157 98 150"/>
  <line class="line soft" x1="46" y1="56" x2="114" y2="56"/>
  <g transform="translate(40 56) rotate(16)">
    <rect class="wheel" x="-6" y="-14" width="12" height="28" rx="3"/>
  </g>
  <g transform="translate(120 56) rotate(16)">
    <rect class="wheel" x="-6" y="-14" width="12" height="28" rx="3"/>
  </g>
  <rect class="tag" x="66" y="48" width="28" height="16" rx="4" fill="#e8590c" stroke="none"/>
  <text class="tag-text" x="80" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" stroke="none">S1</text>
  <rect class="tag" x="66" y="98" width="28" height="16" rx="4" fill="#e8590c" stroke="none"/>
  <text class="tag-text" x="80" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" stroke="none">M1</text>
</svg>
