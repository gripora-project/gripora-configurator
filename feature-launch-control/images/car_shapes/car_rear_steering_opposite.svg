<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Rear steering on S2. Rear wheels steer against the front ones. Layered over car_body.svg. -->
  <line class="line soft" x1="46" y1="160" x2="114" y2="160"/>
  <g transform="translate(40 160) rotate(-16)">
    <rect class="wheel" x="-6" y="-14" width="12" height="28" rx="3"/>
  </g>
  <g transform="translate(120 160) rotate(-16)">
    <rect class="wheel" x="-6" y="-14" width="12" height="28" rx="3"/>
  </g>
  <rect class="tag" x="66" y="152" width="28" height="16" rx="4" fill="#e8590c" stroke="none"/>
  <text class="tag-text" x="80" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" stroke="none">S2</text>
</svg>
